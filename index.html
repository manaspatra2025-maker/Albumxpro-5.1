<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Line India | License Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3595/3595030.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
        
        :root {
            --bg-deep: #020617;
            --card-bg: #0f172a;
            --border: #1e293b;
            --accent: #38bdf8;
            --glow: rgba(56, 189, 248, 0.15);
        }

        body { 
            background-color: var(--bg-deep); 
            color: #f1f5f9; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-image: radial-gradient(circle at top right, #1e1b4b, transparent);
            min-height: 100vh;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        .glass-card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }

        .db-row {
            transition: all 0.3s ease;
            border-bottom: 1px solid rgba(30, 41, 59, 0.5);
        }
        .db-row:hover {
            background: rgba(56, 189, 248, 0.03);
        }

        .input-cyber {
            background: #020617 !important;
            border: 1px solid #1e293b !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-cyber:focus {
            border-color: var(--accent) !important;
            box-shadow: 0 0 15px var(--glow);
        }

        .btn-cyber {
            background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
            transition: all 0.3s ease;
        }
        .btn-cyber:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
            filter: brightness(1.1);
        }
        .btn-cyber:active { transform: translateY(0); }

        .status-pill {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        @media (max-width: 768px) {
            .container { padding: 16px !important; }
            .header-flex { flex-direction: column; align-items: flex-start !important; }
        }
    </style>
</head>
<body class="antialiased pb-20">

    <div class="container mx-auto p-4 md:p-8 max-w-7xl">
        <div class="header-flex flex flex-row justify-between items-center mb-10 gap-6">
            <div>
                <div class="flex items-center gap-3">
                    <div class="h-10 w-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-900/20">
                        <i class="fas fa-shield-halved text-white text-lg"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight">
                            Album X <span class="text-blue-500">PRO 5.1</span>
                        </h1>
                        <p class="text-slate-500 text-[12px] font-semibold tracking-wide uppercase">
                            Studio Line India • Management Console
                        </p>
                    </div>
                </div>
            </div>
            
            <div id="connection-status" class="flex items-center gap-3 text-[11px] font-bold text-emerald-400 bg-emerald-500/5 border border-emerald-500/20 px-5 py-2.5 rounded-full backdrop-blur-md">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                DATABASE CONNECTED
            </div>
        </div>

        <div class="glass-card rounded-3xl p-6 md:p-8 mb-8">
            <h2 class="text-[11px] font-black mb-6 uppercase text-blue-500 tracking-[0.3em] flex items-center gap-2">
                <span class="w-8 h-[1px] bg-blue-500/30"></span>
                Provisioning Protocol
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-12 gap-5">
                <div class="md:col-span-4 space-y-2">
                    <label class="text-[11px] font-bold text-slate-400 ml-1">LICENSE IDENTIFIER</label>
                    <input type="text" id="licenseKey" placeholder="XXXX-XXXX-XXXX" class="input-cyber w-full p-4 rounded-2xl outline-none text-sm mono">
                </div>
                <div class="md:col-span-3 space-y-2">
                    <label class="text-[11px] font-bold text-slate-400 ml-1">HARDWARE SIGNATURE</label>
                    <input type="text" id="hwid" placeholder="ID:77X-00A" class="input-cyber w-full p-4 rounded-2xl outline-none text-sm mono">
                </div>
                <div class="md:col-span-2 space-y-2">
                    <label class="text-[11px] font-bold text-slate-400 ml-1">NODE STATE</label>
                    <select id="status" class="input-cyber w-full p-4 rounded-2xl outline-none text-sm appearance-none cursor-pointer">
                        <option value="Active">Active</option>
                        <option value="Pending">Pending</option>
                        <option value="Expired">Expired</option>
                    </select>
                </div>
                <div class="md:col-span-3 flex items-end">
                    <button id="saveBtn" class="btn-cyber w-full py-4 rounded-2xl text-sm font-black uppercase tracking-widest flex items-center justify-center gap-2">
                        <i class="fas fa-plus-circle"></i>
                        Commit Node
                    </button>
                </div>
            </div>
        </div>

        <div class="glass-card rounded-3xl overflow-hidden">
            <div class="bg-slate-900/50 px-8 py-5 border-b border-slate-800/50 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-2 h-2 bg-blue-500 rounded-full animate-pulse"></div>
                    <span class="text-[12px] font-bold uppercase tracking-[0.1em] text-slate-300">Active Deployment Clusters</span>
                </div>
                <span id="node-count" class="text-[10px] bg-blue-600/20 text-blue-400 border border-blue-500/30 px-4 py-1.5 rounded-lg font-black italic">
                    INITIALIZING...
                </span>
            </div>
            
            <div class="overflow-x-auto overflow-y-hidden">
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-slate-950/50 text-slate-500 uppercase text-[10px] font-black tracking-widest">
                            <th class="px-8 py-6">ID</th>
                            <th class="px-8 py-6">License Identifier</th>
                            <th class="px-8 py-6">Hardware Signature</th>
                            <th class="px-8 py-6">Last Sync</th>
                            <th class="px-8 py-6 text-center">Status</th>
                            <th class="px-8 py-6 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="db-tbody" class="mono text-sm">
                        <tr>
                            <td colspan="6" class="px-8 py-24 text-center">
                                <div class="flex flex-col items-center gap-4">
                                    <div class="w-12 h-12 border-4 border-blue-500/20 border-t-blue-500 rounded-full animate-spin"></div>
                                    <p class="text-slate-500 font-bold animate-pulse text-xs tracking-widest">SYNCING WITH MAINFRAME...</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Your Config
        const firebaseConfig = {
            apiKey: "AIzaSyApAaZ3rjv8Mbw0-DNJm-mIyOf5saDAQVs",
            authDomain: "test-e91f7.firebaseapp.com",
            databaseURL: "https://test-e91f7-default-rtdb.firebaseio.com",
            projectId: "test-e91f7",
            storageBucket: "test-e91f7.firebasestorage.app",
            messagingSenderId: "147299798381",
            appId: "1:147299798381:web:751497cd3996e340e05e64"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // CRUD Logic
        document.getElementById('saveBtn').onclick = () => {
            const key = document.getElementById('licenseKey').value.trim();
            const hwid = document.getElementById('hwid').value.trim() || "UNDEFINED";
            const status = document.getElementById('status').value;

            if(!key) {
                alert("Please enter a License Key");
                return;
            }

            set(ref(db, 'licenses/' + key), {
                activeHardwareId: hwid,
                updatedAt: serverTimestamp(),
                status: status
            }).then(() => {
                document.getElementById('licenseKey').value = "";
                document.getElementById('hwid').value = "";
            });
        };

        onValue(ref(db, 'licenses'), (snapshot) => {
            const tbody = document.getElementById('db-tbody');
            const nodeCount = document.getElementById('node-count');
            tbody.innerHTML = "";
            
            if (snapshot.exists()) {
                let sl = 1;
                snapshot.forEach((child) => {
                    const id = child.key;
                    const data = child.val();
                    const date = data.updatedAt ? new Date(data.updatedAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '---';
                    
                    const statusStyles = {
                        'Active': 'text-emerald-400 bg-emerald-400/10 border border-emerald-400/20',
                        'Pending': 'text-amber-400 bg-amber-400/10 border border-amber-400/20',
                        'Expired': 'text-rose-400 bg-rose-400/10 border border-rose-400/20'
                    };

                    const style = statusStyles[data.status] || 'text-slate-400 bg-slate-400/10';

                    const rowHtml = `
                        <tr class="db-row group">
                            <td class="px-8 py-5 text-slate-600 font-bold">${sl.toString().padStart(2, '0')}</td>
                            <td class="px-8 py-5 font-bold text-white tracking-wide">${id}</td>
                            <td class="px-8 py-5 text-slate-400">
                                <span class="bg-slate-900 px-2 py-1 rounded border border-slate-800">${data.activeHardwareId}</span>
                            </td>
                            <td class="px-8 py-5 text-slate-500 text-[12px]">${date}</td>
                            <td class="px-8 py-5 text-center">
                                <span class="status-pill ${style}">${data.status}</span>
                            </td>
                            <td class="px-8 py-5 text-right">
                                <button onclick="deleteNode('${id}')" class="w-9 h-9 rounded-xl bg-rose-500/5 text-rose-500 hover:bg-rose-500 hover:text-white transition-all flex items-center justify-center ml-auto">
                                    <i class="fas fa-trash-can text-xs"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                    tbody.insertAdjacentHTML('beforeend', rowHtml);
                    sl++;
                });
                nodeCount.innerText = `${sl - 1} NODES ACTIVE`;
            } else {
                tbody.innerHTML = "<tr><td colspan='6' class='px-8 py-20 text-center text-slate-600 italic uppercase tracking-[0.2em] text-xs'>Zero Data Clusters Detected</td></tr>";
                nodeCount.innerText = "NO NODES";
            }
        });

        window.deleteNode = (id) => {
            if(confirm(`SYSTEM ACTION: Decommission node ${id}?`)) {
                remove(ref(db, 'licenses/' + id));
            }
        };
    </script>
</body>
</html>
