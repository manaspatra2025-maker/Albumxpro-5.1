<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional License Manager | Ultra Dark</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        
        :root {
            --bg-deep: #05070a;
            --card-bg: #0d1117;
            --border-color: #1f2937;
            --accent-blue: #38bdf8;
        }

        body { 
            background-color: var(--bg-deep); 
            color: #e6edf3; 
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Smooth Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 20px; }

        /* Neon Glow Effect */
        .glow-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .db-row {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border-bottom: 1px solid #161b22;
        }
        .db-row:hover {
            background-color: #161b22;
            transform: scale(1.002);
        }

        .status-pill {
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        input, select {
            transition: border 0.3s ease, box-shadow 0.3s ease;
        }

        input:focus, select:focus {
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15);
        }

        .btn-push {
            background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
            transition: transform 0.2s active;
        }
        
        .btn-push:hover {
            filter: brightness(1.1);
        }
    </style>
</head>
<body class="antialiased">

    <div class="container mx-auto p-6 md:p-12 max-w-6xl">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-12 gap-4">
            <div>
                <h1 class="text-3xl font-extrabold text-white tracking-tight flex items-center gap-3">
                    <span class="p-2 bg-blue-600/10 rounded-lg text-blue-500">
                        <i class="fas fa-terminal"></i>
                    </span>
                    Album X <span class="text-blue-500">PRO 5.1</span> ( Multi System )
                </h1>
                <p class="text-gray-500 text-sm mt-2 font-medium">Manas & Biswajit Studio Line India</p>
            </div>
            <div id="connection-status" class="flex items-center gap-3 text-[11px] font-bold text-emerald-400 bg-emerald-500/5 border border-emerald-500/20 px-4 py-2 rounded-full shadow-inner">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                SYSTEM ONLINE
            </div>
        </div>

        <div class="glow-card rounded-2xl p-8 mb-10">
            <h2 class="text-[11px] font-black mb-6 uppercase text-blue-500 tracking-[0.2em]">Deployment Protocol</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <div class="space-y-2">
                    <label class="text-[10px] uppercase font-bold text-gray-500">Master License Key</label>
                    <input type="text" id="licenseKey" placeholder="XXXX-XXXX-XXXX" class="w-full bg-black border border-[#30363d] p-3 rounded-xl outline-none focus:border-blue-500 text-sm mono text-white">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] uppercase font-bold text-gray-500">Hardware Signature</label>
                    <input type="text" id="hwid" placeholder="ID:000-000" class="w-full bg-black border border-[#30363d] p-3 rounded-xl outline-none focus:border-blue-500 text-sm mono text-white">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] uppercase font-bold text-gray-500">Node State</label>
                    <select id="status" class="w-full bg-black border border-[#30363d] p-3 rounded-xl outline-none focus:border-blue-500 text-sm text-white">
                        <option value="Active">Active</option>
                        <option value="Pending">Pending</option>
                        <option value="Expired">Expired</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button id="saveBtn" class="btn-push w-full text-white py-3 rounded-xl text-sm font-bold uppercase tracking-widest shadow-lg shadow-blue-500/20">
                        Commit Node
                    </button>
                </div>
            </div>
        </div>

        <div class="glow-card rounded-2xl overflow-hidden border border-[#21262d]">
            <div class="bg-[#161b22]/50 px-8 py-4 border-b border-[#21262d] flex items-center justify-between">
                <span class="text-[11px] font-bold uppercase tracking-widest text-gray-400">Data Clusters</span>
                <span id="node-count" class="text-[10px] bg-blue-500 text-white px-3 py-1 rounded-full font-bold">0 Active Nodes</span>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-[#0d1117] text-gray-500 uppercase text-[9px] font-black tracking-widest">
                        <tr>
                            <th class="px-8 py-5">Index</th>
                            <th class="px-8 py-5">License Identifier</th>
                            <th class="px-8 py-5">Hardware ID</th>
                            <th class="px-8 py-5">Sync Timestamp</th>
                            <th class="px-8 py-5 text-center">Status</th>
                            <th class="px-8 py-5 text-right">Control</th>
                        </tr>
                    </thead>
                    <tbody id="db-tbody" class="mono text-xs">
                        <tr>
                            <td colspan="6" class="px-8 py-16 text-center text-gray-600">
                                <i class="fas fa-circle-notch fa-spin text-2xl text-blue-500 mb-3"></i>
                                <p class="animate-pulse">Accessing Mainframe...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyApAaZ3rjv8Mbw0-DNJm-mIyOf5saDAQVs",
            authDomain: "test-e91f7.firebaseapp.com",
            databaseURL: "https://test-e91f7-default-rtdb.firebaseio.com",
            projectId: "test-e91f7",
            storageBucket: "test-e91f7.firebasestorage.app",
            messagingSenderId: "147299798381",
            appId: "1:147299798381:web:751497cd3996e340e05e64"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        document.getElementById('saveBtn').onclick = () => {
            const key = document.getElementById('licenseKey').value.trim();
            const hwid = document.getElementById('hwid').value.trim() || "NULL";
            const status = document.getElementById('status').value;

            if(!key) return;

            set(ref(db, 'licenses/' + key), {
                activeHardwareId: hwid,
                updatedAt: serverTimestamp(),
                status: status
            }).then(() => {
                document.getElementById('licenseKey').value = "";
                document.getElementById('hwid').value = "";
            });
        };

        onValue(ref(db, 'licenses'), (snapshot) => {
            const tbody = document.getElementById('db-tbody');
            const nodeCount = document.getElementById('node-count');
            tbody.innerHTML = "";
            
            if (snapshot.exists()) {
                let sl = 1;
                snapshot.forEach((child) => {
                    const id = child.key;
                    const data = child.val();
                    const date = data.updatedAt ? new Date(data.updatedAt).toLocaleTimeString() : '---';
                    
                    const statusStyles = {
                        'Active': 'text-emerald-400 bg-emerald-400/10 border border-emerald-400/20',
                        'Pending': 'text-amber-400 bg-amber-400/10 border border-amber-400/20',
                        'Expired': 'text-rose-400 bg-rose-400/10 border border-rose-400/20'
                    };

                    const style = statusStyles[data.status] || 'text-gray-400';

                    const rowHtml = `
                        <tr class="db-row">
                            <td class="px-8 py-5 text-gray-600 font-bold">${sl.toString().padStart(2, '0')}</td>
                            <td class="px-8 py-5 font-bold text-white tracking-wide">${id}</td>
                            <td class="px-8 py-5 text-gray-400">${data.activeHardwareId}</td>
                            <td class="px-8 py-5 text-gray-500 uppercase">${date}</td>
                            <td class="px-8 py-5 text-center">
                                <span class="status-pill ${style}">${data.status}</span>
                            </td>
                            <td class="px-8 py-5 text-right">
                                <button onclick="deleteNode('${id}')" class="w-8 h-8 rounded-lg bg-red-500/5 text-red-500 hover:bg-red-500 hover:text-white transition-all">
                                    <i class="fas fa-trash-alt text-[10px]"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                    tbody.insertAdjacentHTML('beforeend', rowHtml);
                    sl++;
                });
                nodeCount.innerText = `${sl - 1} NODES REGISTERED`;
            } else {
                tbody.innerHTML = "<tr><td colspan='6' class='px-8 py-20 text-center text-gray-700 italic uppercase tracking-widest text-[10px]'>Empty Repository</td></tr>";
                nodeCount.innerText = "NO NODES";
            }
        });

        window.deleteNode = (id) => {
            if(confirm(`Confirm deletion of entry: ${id}?`)) {
                remove(ref(db, 'licenses/' + id));
            }
        };
    </script>
</body>
</html>
